services:
  db:
    image: postgres:16-alpine
    container_name: passion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: passion
      POSTGRES_PASSWORD: passion
      POSTGRES_DB: passion
    ports:
      - "5433:5432"
    volumes:
      - passion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passion -d passion"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    container_name: passion-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8088:8088"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  passion_pgdata:
