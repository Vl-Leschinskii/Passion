# Shared app routing — included via duplicate listen ports in server blocks below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 8088;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    location = /passion {
        return 302 /passion/;
    }

    location = /passion/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location = /passion/admin {
        return 302 /passion/admin/;
    }

    # Tolerate accidental double slash from typed URLs
    location = /passion//admin {
        return 302 /passion/admin/;
    }
    location = /passion//admin/ {
        return 302 /passion/admin/;
    }

    location = /passion/admin/ {
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location /passion/api/ {
        proxy_pass http://172.21.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://172.21.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 100m;
    }
}
